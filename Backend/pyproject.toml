[project]
name = "reunite-api"
version = "1.0.0"
description = "Reunite FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "psycopg[binary,pool]==3.2.3",
    "python-dotenv==1.0.1",
    "PyJWT==2.10.1",
    "bcrypt==4.2.1",
    "httpx==0.28.1",
    "numpy==2.2.1",
    "opencv-python-headless==4.10.0.84",
    "Pillow==11.1.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "python-multipart==0.0.20"
]

[tool.vercel]
entrypoint = "api:app"
